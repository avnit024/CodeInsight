server.port=8080

# H2 file database (data is saved in ./data folder, no install needed)
spring.datasource.url=jdbc:h2:file:./data/codeinsight
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT: set the JWT_SECRET environment variable in real use (min 32 characters)
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123}
app.jwt.expiration-ms=86400000

# AI hints (Google Gemini). Set GEMINI_API_KEY in your environment; model name is configurable.
app.gemini.key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# GitHub OAuth login (optional). Callback URL to register: http://localhost:8080/api/auth/github/callback
app.oauth.github.client-id=${GITHUB_CLIENT_ID:}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
